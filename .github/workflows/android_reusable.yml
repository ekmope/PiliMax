name: Reusable Android Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        default: ""
        type: string
      tag:
        description: "Publish release when non-empty; actual tag uses build number"
        required: false
        default: ""
        type: string
      dev:
        description: "Whether to build dev variant"
        required: false
        default: false
        type: boolean
      target_platforms:
        description: "Flutter target platforms"
        required: false
        default: "android-arm64"
        type: string
      upload_arm64_v8a:
        description: "Upload arm64-v8a artifact"
        required: false
        default: true
        type: boolean
      upload_armeabi_v7a:
        description: "Upload armeabi-v7a artifact"
        required: false
        default: true
        type: boolean
      upload_x86_64:
        description: "Upload x86_64 artifact"
        required: false
        default: true
        type: boolean
    secrets:
      SIGN_KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

jobs:
  android:
    name: Release Android
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Write key
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${SIGN_KEYSTORE_BASE64}" ]; then
            echo "${SIGN_KEYSTORE_BASE64}" | base64 --decode > android/app/key.jks
            echo storeFile='key.jks' >> android/key.properties
            echo storePassword='${KEYSTORE_PASSWORD}' >> android/key.properties
            echo keyAlias='${KEY_ALIAS}' >> android/key.properties
            echo keyPassword='${KEY_PASSWORD}' >> android/key.properties
          fi

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Build Android APKs
        id: build
        shell: bash
        run: |
          set -uo pipefail

          args=(
            build apk
            --release
            --split-per-abi
            --target-platform "${{ inputs.target_platforms }}"
            --dart-define-from-file=pili_release.json
            --pub
          )

          if [ "${{ inputs.dev }}" = "true" ]; then
            args+=(--android-project-arg dev=1)
          fi

          set -o pipefail
          flutter "${args[@]}" 2>&1 | tee build-output.log
          exit "${PIPESTATUS[0]}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Surface build errors as annotations
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f build-output.log ]; then
            echo "::error title=Build failed without log::No build-output.log produced"
            exit 0
          fi
          # Emit each Dart analyzer error as a GitHub annotation so it is
          # visible on the run summary page without downloading artifacts.
          grep -E '(^|/)lib/[^:]+:[0-9]+:[0-9]+: Error:' build-output.log \
            | head -50 \
            | while IFS= read -r line; do
                file=$(echo "$line" | sed -E 's|^.*?([^ ]+lib/[^:]+):[0-9]+:[0-9]+:.*|\1|')
                ln=$(echo "$line" | sed -E 's|^.*lib/[^:]+:([0-9]+):.*|\1|')
                msg=$(echo "$line" | sed -E 's|^.* Error: ||')
                echo "::error file=${file},line=${ln},title=Dart::${msg}"
              done || true
          # Also surface non-Dart failures (gradle, native) as plain errors
          grep -E 'FAILURE:|error:|Error:' build-output.log \
            | grep -v '^lib/\|/lib/' \
            | tail -10 \
            | while IFS= read -r line; do
                echo "::error title=Build::${line}"
              done || true
          echo "::warning title=Build summary::$(grep -c 'Error:' build-output.log || echo 0) error lines found; full log in artifacts"
          exit 0

      - name: Rename APKs
        shell: bash
        run: |
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
            mv "$file" "PiliNara_android_${{ env.version }}_${abi}.apk"
          done

      - name: Release to GitHub
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_tag }}
          files: |
            PiliNara_android_*.apk
            release-manifest.json

      - name: Upload arm64-v8a
        if: ${{ inputs.upload_arm64_v8a }}
        uses: actions/upload-artifact@v7
        with:
          name: Android_arm64-v8a
          path: PiliNara_android_*_arm64-v8a.apk

      - name: Upload armeabi-v7a
        if: ${{ inputs.upload_armeabi_v7a }}
        uses: actions/upload-artifact@v7
        with:
          name: Android_armeabi-v7a
          path: PiliNara_android_*_armeabi-v7a.apk

      - name: Upload x86_64
        if: ${{ inputs.upload_x86_64 }}
        uses: actions/upload-artifact@v7
        with:
          name: Android_x86_64
          path: PiliNara_android_*_x86_64.apk
