name: Build for iOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Build iOS
        run: |
          max_attempts=6
          build_status=1
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            log_file="$(mktemp)"
            set +e
            flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub -v 2>&1 | tee "$log_file"
            build_status=${PIPESTATUS[0]}
            set -e

            if [ "$build_status" -eq 0 ]; then
              rm -f "$log_file"
              break
            fi

            if grep -Eiq 'badResponseStatusCode[^0-9]*(502|503|504)|HTTP[^[:digit:]]*(502|503|504)|(^|[^0-9])(502|503|504)([^0-9]|$)|Bad Gateway|Service Unavailable|Gateway Timeout|timed out|Connection reset by peer|Could not resolve host|network connection was lost|temporary failure in name resolution|NSURLErrorDomain Code=(-1001|-1003|-1005|-1009)' "$log_file" && [ "$attempt" -lt "$max_attempts" ]; then
              echo "Transient Swift package download failure; retrying iOS build ($attempt/$max_attempts)."
              rm -f "$log_file"
              rm -rf build/ios/iphoneos/Runner.app
              sleep $((attempt * 10))
              continue
            fi

            rm -f "$log_file"
            break
          done
          set -e
          if [ "$build_status" -ne 0 ]; then
            exit "$build_status"
          fi
          ln -sf ./build/ios/iphoneos Payload
          # make AltSign happy...
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 PiliMax_ios_${{env.version}}.ipa Payload/Runner.app

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            PiliMax_ios_*.ipa

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: iOS-release
          path: PiliMax_ios_*.ipa
