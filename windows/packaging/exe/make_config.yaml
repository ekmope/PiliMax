script_template: inno_setup.iss
# AppId 的值唯一标识此应用。
# 不要在其他应用的安装程序中使用相同的 AppId 值。
# Keep this AppId unique to PiliMax so Inno Setup does not treat it as
# an upgrade of the upstream PiliPlus installer.
app_id: dfdbbe30-eadc-4f6b-aedf-7eb7b40e144f
publisher: PiliMax
publisher_url: https://github.com/ekmope/PiliMax
display_name: PiliMax
# create_desktop_icon: true
# See: https://jrsoftware.org/ishelp/index.php?topic=setup_defaultdirname
# fastforge otherwise derives this from pubspec.name.
install_dir_name: '{autopf64}\PiliMax'
# 这里的路径是相对于项目根目录的路径； 图标格式必须是ico格式，不能是png或其它
setup_icon_file: windows\runner\resources\app_icon.ico
locales:
  - en
  - zh
privileges_required: admin
