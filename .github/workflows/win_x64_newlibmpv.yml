name: Build for Windows x64 With NewLibmpv

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-windows-app:
    name: Release Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Add fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          choco install innosetup

      - name: Add Chinese language file for Inno Setup
        run: |
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: pwsh

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      # 仅在此 CI 工作树切换到 NewLibmpv 依赖并适配播放器 API。
      - name: Apply NewLibmpv patch & verify dependency checkout
        shell: pwsh
        run: lib/scripts/newlibmpv.ps1

      - name: Build Windows
        run: |
          fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json" --skip-clean

      # 产物重命名为含有 NewLibmpv 后缀
      - name: Prepare Upload
        run: |
          mkdir -p Release/PiliMax-Win-NewLibmpv
          mkdir -p PiliMax-Win-NewLibmpv-Setup
          mv build/windows/x64/runner/Release/* Release/PiliMax-Win-NewLibmpv/
          mv dist/**/*.exe PiliMax-Win-NewLibmpv-Setup/PiliMax_windows_${{env.version}}_x64_NewLibmpv_setup.exe

      - name: Compress
        run: |
          Compress-Archive -Path "Release/PiliMax-Win-NewLibmpv" -DestinationPath "PiliMax_windows_${{env.version}}_x64_NewLibmpv_portable.zip"
        shell: pwsh

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            PiliMax_windows_*_NewLibmpv_portable.zip
            PiliMax-Win-NewLibmpv-Setup/PiliMax_windows_*_NewLibmpv_setup.exe

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-file-x64-NewLibmpv-release
          path: PiliMax_windows_*_NewLibmpv_portable.zip

      - name: Upload Windows setup artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-setup-x64-NewLibmpv-release
          path: PiliMax-Win-NewLibmpv-Setup/PiliMax_windows_*_NewLibmpv_setup.exe
