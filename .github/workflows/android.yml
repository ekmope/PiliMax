name: Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rust-core:
    name: Test Rust core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        working-directory: core
        run: cargo test --locked

  android:
    name: Build Android release APK (arm64-v8a)
    runs-on: ubuntu-latest
    needs: rust-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          # Android 17（compileSdk 37）+ NDK r28（Armv9/Oryon LLVM 调度）。
          # 2026 年起平台包按 minor 版本命名（android-37.0），AGP 仍查找 android-37 目录。
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.0.13004108"

      - name: Alias platform android-37 -> android-37.0
        run: |
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          ls -l "$ANDROID_HOME/platforms"

      - name: Setup Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Rust 交叉编译由 Gradle 的 cargoBuildArm/copyRustSo 任务自动完成，
      # 链接器直接指向 NDK r28 clang（API 26），无需 cargo-ndk。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :plugin-vlc:assembleRelease --no-daemon 2>&1 | tee gradle-build.log

      - name: Surface gradle errors
        if: failure()
        continue-on-error: true
        working-directory: android
        run: |
          if [ ! -f gradle-build.log ]; then exit 0; fi
          # Kotlin/Java 编译错误带 file:line，逐条转成 annotation。
          grep -E '\.kt:[0-9]+:[0-9]+: error:|\.java:[0-9]+: error:' gradle-build.log \
            | head -30 \
            | while IFS= read -r line; do
                echo "::error title=Kotlin::${line}"
              done || true
          # e: 开头的 Kotlin 错误行（kotlinc 风格）。
          grep -E '^e: .*error: ' gradle-build.log | head -30 \
            | while IFS= read -r line; do
                echo "::error title=KotlinE::${line}"
              done || true
          # 兜底：FAILURE 段落上下文。
          grep -n -A 8 'FAILURE: Build failed' gradle-build.log | head -24 \
            | while IFS= read -r line; do
                echo "::error title=Gradle::${line}"
              done || true
          exit 0

      - name: Upload gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_number }}
          path: android/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/piliAI-latest-arm64-v8a.apk
          # 宿主按该固定资产名做内核插件的版本无关下载（releases/latest/download/vlc-core.apk）。
          cp android/plugin-vlc/build/outputs/apk/release/plugin-vlc-release.apk dist/vlc-core.apk
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piliAI-android-arm64-v8a-release
          path: dist/*.apk

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: piliAI-android-arm64-v8a-release
          path: dist

      - name: Rename app APK with tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp dist/piliAI-latest-arm64-v8a.apk "dist/piliAI-${TAG}-arm64-v8a.apk"
          ls -lh dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
          generate_release_notes: true
