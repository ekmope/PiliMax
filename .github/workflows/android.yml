name: Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rust-core:
    name: Test Rust core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        working-directory: core
        run: cargo test --locked

  android:
    name: Build Android release APK (arm64-v8a)
    runs-on: ubuntu-latest
    needs: rust-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          # Android 17（compileSdk 37）+ NDK r28（Armv9/Oryon LLVM 调度）。
          # 2026 年起平台包按 minor 版本命名（android-37.0），AGP 仍查找 android-37 目录。
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.0.13004108"

      - name: Alias platform android-37 -> android-37.0
        run: |
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          ls -l "$ANDROID_HOME/platforms"

      - name: Setup Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Rust 交叉编译由 Gradle 的 cargoBuildArm/copyRustSo 任务自动完成，
      # 链接器直接指向 NDK r28 clang（API 26），无需 cargo-ndk。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piliAI-android-arm64-v8a-release
          path: android/app/build/outputs/apk/release/app-release.apk

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: piliAI-android-arm64-v8a-release
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
