[package]
name = "pilinara_core"
version = "0.2.0"
edition = "2021"
description = "piliAI native core: today-watch recommendation, animeko source subscription, danmaku, feed filter and sniffer (Rust)"

# 产出 JNI 动态库（libpilinara_core.so）供 Android 加载，同时保留 rlib 便于单元测试。
[lib]
name = "pilinara_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# HTML 解析（对应 animeko SelectorMediaSource 的 CSS 选择器抓取）
scraper = "0.20"
regex = "1.10"
# URL 解析/合并（源订阅相对链接解析根部）
url = "2.5"

[profile.release]
# 面向唯一目标设备（第五代骁龙 8 至尊版）做激进体积/性能优化：
# fat LTO + 单 codegen unit 让弹幕解析/合并热路径获得更好的内联与布局。
lto = "fat"
codegen-units = 1
# 必须保持 unwind：JNI 边界用 catch_unwind 把解析器对畸形输入的 panic
# 转成 Java 异常，而不是让整个 App 进程被 SIGABRT 直接杀死（点播放秒退）。
panic = "unwind"
strip = "symbols"
